name: Build WhatsAppake Desktop Apps

on:
  workflow_dispatch:

env:
  NODE_VERSION: "22"
  APP_URL: "https://web.whatsapp.com"
  BUCKET_REPO: "santarl/scoop_bucket"
  # Absolute so the Rust build output lands in the workspace and can be cached
  # (a global npm install would otherwise build inside node_modules).
  CARGO_TARGET_DIR: ${{ github.workspace }}/pake-target

permissions:
  contents: write

jobs:
  build:
    strategy:
      max-parallel: 1 # serialize so both jobs don't race pushing to scoop_bucket
      matrix:
        app:
          - name: WhatsAppake1
            manifest: whatsappake1.json
          - name: WhatsAppake2
            manifest: whatsappake2.json
    name: Build ${{ matrix.app.name }}
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Pake CLI (newest fork build, upstream fallback)
        id: pake
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Newest release in this repo that carries a pake-cli.tgz asset. Releases without
          # one (WhatsAppake app releases, etc.) are skipped. If none exists or anything
          # fails, fall back to upstream pake-cli instead of failing the build.
          $url = $null
          try {
            $rows = @(gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate --jq '.[] | select(.draft == false) | . as $r | $r.assets[] | select(.name == "pake-cli.tgz") | "\($r.created_at)\t\(.browser_download_url)"')
            if ($LASTEXITCODE -ne 0) { throw "gh api exited with $LASTEXITCODE" }
            $latest = $rows | Where-Object { $_ } | Sort-Object -Descending | Select-Object -First 1
            if ($latest) { $url = ($latest -split "`t")[1] }
          } catch {
            Write-Host "::warning::Could not list releases: $_"
          }

          $source = "upstream npm (pake-cli)"
          if ($url) {
            Write-Host "Installing fork pake-cli from $url"
            npm install -g $url
            if ($LASTEXITCODE -eq 0) { $source = $url }
            else { Write-Host "::warning::Fork pake-cli install failed, falling back to upstream"; $url = $null }
          } else {
            Write-Host "::warning::No fork pake-cli release found, falling back to upstream pake-cli"
          }
          if (-not $url) {
            npm install -g pake-cli
            if ($LASTEXITCODE -ne 0) { throw "Installing upstream pake-cli failed" }
          }

          # Cache key follows the Cargo.lock of whichever Pake was actually installed.
          $lock = Join-Path (npm root -g) "pake-cli/src-tauri/Cargo.lock"
          $hash = if (Test-Path $lock) { (Get-FileHash -Algorithm SHA256 $lock).Hash.ToLower() } else { "nolock" }
          echo "lock_hash=$hash" >> $env:GITHUB_OUTPUT
          echo "Pake source: $source" >> $env:GITHUB_STEP_SUMMARY

      - name: Rust cache restore
        uses: actions/cache/restore@v4.2.0
        id: cache_store
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            pake-target/
          key: ${{ runner.os }}-cargo-pake-${{ steps.pake.outputs.lock_hash }}

      - name: Set version
        id: version
        shell: pwsh
        run: |
          # Tauri requires strict MAJOR.MINOR.PATCH semver - no date-based 4th segment.
          # Run number as the patch digit keeps it unique and monotonically increasing per run.
          $version = "1.0.${{ github.run_number }}"
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build App
        timeout-minutes: 25
        shell: pwsh
        run: |
          pake "${{ env.APP_URL }}" `
            --name "${{ matrix.app.name }}" `
            --width 1000 `
            --height 700 `
            --min-width 600 `
            --min-height 500 `
            --app-version "${{ steps.version.outputs.version }}" `
            --show-system-tray `
            --start-to-tray `
            --hide-on-close true `
            --keep-binary

      - name: Compute SHA256 hash
        id: hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 "${{ matrix.app.name }}.exe").Hash.ToLower()
          echo "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Upload standalone EXE (build artifact)
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.app.name }}-Windows-exe
          path: ${{ matrix.app.name }}.exe
          retention-days: 7

      - name: Publish GitHub Release (Pake fork)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.app.name }}-v${{ steps.version.outputs.version }}
          name: ${{ matrix.app.name }} v${{ steps.version.outputs.version }}
          make_latest: false
          files: ${{ matrix.app.name }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout scoop_bucket
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BUCKET_REPO }}
          token: ${{ secrets.SCOOP_BUCKET_PAT }}
          path: scoop-bucket

      - name: Write Scoop manifest
        shell: pwsh
        run: |
          $manifest = [ordered]@{
              '$schema'   = "https://raw.githubusercontent.com/ScoopInstaller/Scoop/master/schema.json"
              version     = "${{ steps.version.outputs.version }}"
              description = "WhatsApp Web packaged as a native Windows desktop app (via Pake)"
              homepage    = "https://github.com/${{ github.repository }}"
              license     = "GPL-3.0-only"
              url         = "https://github.com/${{ github.repository }}/releases/download/${{ matrix.app.name }}-v${{ steps.version.outputs.version }}/${{ matrix.app.name }}.exe"
              hash        = "${{ steps.hash.outputs.sha256 }}"
              bin         = "${{ matrix.app.name }}.exe"
              shortcuts   = @(
                  ,@("${{ matrix.app.name }}.exe", "${{ matrix.app.name }}")
              )
              persist     = @()
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path "scoop-bucket/bucket/${{ matrix.app.manifest }}" -Encoding utf8

      - name: Commit manifest to scoop_bucket
        shell: bash
        working-directory: scoop-bucket
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "bucket/${{ matrix.app.manifest }}"
          if git diff --staged --quiet; then
            echo "No manifest changes to commit"
          else
            git commit -m "chore: update ${{ matrix.app.name }} to v${{ steps.version.outputs.version }}"
            git push
          fi

      - name: Rust cache store
        uses: actions/cache/save@v4.2.0
        if: steps.cache_store.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            pake-target/
          key: ${{ runner.os }}-cargo-pake-${{ steps.pake.outputs.lock_hash }}
